name: Build DLT Viewer FOTA plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          aqtversion: '==3.2.*'
          cache: true

      - name: Configure FOTA plugin
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DDLT_VIEWER_SDK="$env:GITHUB_WORKSPACE\third_party\dlt-sdk"

      - name: Build FOTA plugin
        shell: pwsh
        run: cmake --build build --config Release

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v5
        with:
          name: fotainjectionplugin-windows-x64
          path: build/Release/fotainjectionplugin.dll
          if-no-files-found: error
