name: Build DLT Viewer FOTA plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          arch: win64_msvc2019_64
          modules: qtserialport
          cache: true

      - name: Checkout DLT Viewer source
        uses: actions/checkout@v4
        with:
          repository: COVESA/dlt-viewer
          path: dlt-viewer
          fetch-depth: 1

      - name: Build DLT Viewer SDK
        shell: pwsh
        run: |
          cmake -S dlt-viewer -B dlt-build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:Qt5_DIR" `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\dlt-sdk" `
            -DDLT_INSTALL_SDK=ON `
            -DDLT_PARSER=OFF
          cmake --build dlt-build --config Release --target install

      - name: Configure FOTA plugin
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:Qt5_DIR" `
            -DDLT_VIEWER_SDK="$env:GITHUB_WORKSPACE\dlt-sdk\sdk"

      - name: Build FOTA plugin
        shell: pwsh
        run: cmake --build build --config Release

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: fotainjectionplugin-windows-x64
          path: build/Release/fotainjectionplugin.dll
          if-no-files-found: error
